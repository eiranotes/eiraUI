name: Capture Grumbl public App Store screenshots

on:
  pull_request:
    branches: [main]
    paths:
      - tools/capture_app_store_screenshots.py
      - .github/workflows/capture-grumbl-app-store.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install capture dependencies
        run: python -m pip install --disable-pip-version-check requests Pillow

      - name: Capture all public iPhone screenshots
        run: |
          python tools/capture_app_store_screenshots.py \
            --app-id 6772917460 \
            --country us \
            --app-url https://apps.apple.com/us/app/grumbl/id6772917460 \
            --output capture-output

      - name: Upload short-lived evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: grumbl-app-store-public-assets
          path: capture-output/
          retention-days: 1
          if-no-files-found: error
