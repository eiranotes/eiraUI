name: Materialize Cool Cats analysis

on:
  pull_request:
    branches: [main]
    paths:
      - tools/.payload/cool-cats-*.b64part
      - .github/workflows/materialize-cool-cats-analysis.yml

permissions:
  contents: write

concurrency:
  group: materialize-cool-cats-analysis
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v4
        with:
          ref: agent/cool-cats-behance-ui-analysis
          fetch-depth: 0

      - name: Decode and verify payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          expected = {
              'cool-cats-00.b64part': ('a94cdd1fcfb90e28c89371cc20700a8e5df130505185cf545f407beb8b161135', 6000),
              'cool-cats-01.b64part': ('a1cea4df4b742621b24fb619e5e80eb94882677a64c0cf55cfd70b577899538b', 6000),
              'cool-cats-02.b64part': ('10c9b457842a5eff58db9343c84164c8ec17f30f12921b150fb0d2bc605bce12', 4184),
          }
          paths = sorted(Path('tools/.payload').glob('cool-cats-*.b64part'))
          assert len(paths) == 3, paths
          chunks = []
          for path in paths:
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              expected_digest, expected_size = expected[path.name]
              print(path.name, len(data), digest)
              assert len(data) == expected_size, (path.name, len(data), expected_size)
              assert digest == expected_digest, (path.name, digest, expected_digest)
              chunks.append(data)
          decoded = base64.b64decode(b''.join(chunks), validate=True)
          digest = hashlib.sha256(decoded).hexdigest()
          print('decoded', len(decoded), digest)
          assert digest == 'c16b39751213284c604db31f045c114be080c135bb5948625656e4d39aa3f7b6'
          Path('/tmp/cool-cats-analysis.tar.xz').write_bytes(decoded)
          PY
          mkdir -p /tmp/cool-cats-analysis
          tar -xJf /tmp/cool-cats-analysis.tar.xz -C /tmp/cool-cats-analysis
          test -s /tmp/cool-cats-analysis/manifest.json
          test -s /tmp/cool-cats-analysis/tokens.tokens.json
          test -s /tmp/cool-cats-analysis/source-map.md

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Validate analysis contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          repo = Path('.')
          target = repo / 'analyses/2026/2026-08-17--cool-cats--behance-mobile-ordering'
          payload = Path('/tmp/cool-cats-analysis')
          schema = json.loads((repo / 'schemas/ui-reference-analysis.schema.json').read_text(encoding='utf-8'))
          manifest = json.loads((payload / 'manifest.json').read_text(encoding='utf-8'))
          tokens = json.loads((payload / 'tokens.tokens.json').read_text(encoding='utf-8'))
          analysis = (target / 'analysis.md').read_text(encoding='utf-8')
          source_map = (payload / 'source-map.md').read_text(encoding='utf-8')

          Draft202012Validator.check_schema(schema)
          errors = sorted(
              Draft202012Validator(schema, format_checker=FormatChecker()).iter_errors(manifest),
              key=lambda item: list(item.path),
          )
          if errors:
              for error in errors:
                  print(f"manifest error at {list(error.path)}: {error.message}")
              raise SystemExit(1)

          assert manifest['analysisId'] == 'UIR-20260817-001'
          assert manifest['status'] == 'complete'
          assert len(manifest['references']) == 7
          assert len(manifest['elements']) == 39
          assert manifest['referenceStorage'] == 'link_only'
          assert manifest['references'][1]['viewport'] == {'width': 2000, 'height': 1456, 'unit': 'px'}
          assert [ref['id'] for ref in manifest['references'][2:6]] == ['REF-03','REF-04','REF-05','REF-06']
          assert all(ref['viewport'] == {'width': 433, 'height': 940, 'unit': 'px'} for ref in manifest['references'][2:6])
          assert analysis.count('REF-0') >= 7
          assert '4 published / 4 analyzed' in analysis
          assert 'Quantity-total inconsistency' in analysis
          assert 'REF-07' in source_map
          assert isinstance(tokens, dict) and tokens
          print('validated UIR-20260817-001: 7 references, 39 elements, 4/4 mobile screens')
          PY

      - name: Install final analysis files and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          target="analyses/2026/2026-08-17--cool-cats--behance-mobile-ordering"
          mkdir -p "$target/references"
          install -m 0644 /tmp/cool-cats-analysis/manifest.json "$target/manifest.json"
          install -m 0644 /tmp/cool-cats-analysis/tokens.tokens.json "$target/tokens.tokens.json"
          install -m 0644 /tmp/cool-cats-analysis/source-map.md "$target/references/source-map.md"
          rm -rf tools/.payload
          rm -f tools/capture_behance_project.py
          rm -f .github/workflows/capture-cool-cats-behance.yml
          rm -f .github/workflows/materialize-cool-cats-analysis.yml

      - name: Commit validated final analysis
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check -- ':!*.md'
          git commit -m "add UIR-20260817-001 Cool Cats analysis"
          git push origin HEAD:agent/cool-cats-behance-ui-analysis
