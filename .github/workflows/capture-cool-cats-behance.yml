name: Capture Cool Cats Behance project

on:
  pull_request:
    branches: [main]
    paths:
      - tools/capture_behance_project.py
      - .github/workflows/capture-cool-cats-behance.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check playwright requests Pillow

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Capture complete public project
        run: |
          python tools/capture_behance_project.py \
            --url 'https://www.behance.net/gallery/227587773/Cool-Cats-Brand-identity-Coffee-Shop?locale=en_US' \
            --project-id 227587773 \
            --output capture-output

      - name: Upload short-lived evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: cool-cats-behance-public-assets
          path: capture-output/
          retention-days: 1
          if-no-files-found: error
