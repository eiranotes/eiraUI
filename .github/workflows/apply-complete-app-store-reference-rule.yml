name: Apply complete app-listing reference rule

on:
  pull_request:
    branches: [main]
    paths:
      - tools/apply_complete_app_store_reference_rule.py
      - .github/workflows/apply-complete-app-store-reference-rule.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out rule branch
        uses: actions/checkout@v4
        with:
          ref: agent/complete-app-store-reference-rule
          fetch-depth: 0

      - name: Apply protocol changes
        run: python tools/apply_complete_app_store_reference_rule.py

      - name: Validate changed protocol files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          required = {
              'docs/METHODOLOGY.md': [
                  'Version `1.1.0`',
                  '### 3.4 Complete public app-listing reference rule',
                  'published count and analyzed count differ',
              ],
              'skill/SKILL_SPEC_DRAFT.md': [
                  'Do not replace it with a similarly named product found through fuzzy search.',
                  'analyze the complete published set in store order',
                  'App Store and Google Play full-reference inventory adapters',
              ],
              'templates/UI_REFERENCE_RECONSTRUCTION.md': [
                  'template_version: "1.1.0"',
                  '### 1.2a Public app-listing completeness',
                  'Published assets',
              ],
              'README.md': [
                  'Protocol version: `1.1.0`',
                  'Template version: `1.1.0`',
                  'analyze every published screenshot',
              ],
          }
          for name, needles in required.items():
              text = Path(name).read_text(encoding='utf-8')
              for needle in needles:
                  assert needle in text, (name, needle)
          print('complete app-listing reference rule validated')
          PY

      - name: Remove one-shot tooling
        run: |
          rm -f tools/apply_complete_app_store_reference_rule.py
          rm -f .github/workflows/apply-complete-app-store-reference-rule.yml

      - name: Commit protocol update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check -- ':!*.md'
          git commit -m "require complete public app screenshot coverage"
          git push origin HEAD:agent/complete-app-store-reference-rule
