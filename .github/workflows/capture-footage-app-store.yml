name: Capture Footage public App Store screenshots

on:
  pull_request:
    branches: [main]
    paths:
      - tools/capture_app_store_screenshots.py
      - .github/workflows/capture-footage-app-store.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install capture dependencies
        run: python -m pip install --disable-pip-version-check requests Pillow

      - name: Capture all public Korean iPhone screenshots
        run: |
          python tools/capture_app_store_screenshots.py \
            --app-id 6792431474 \
            --country kr \
            --expected 6 \
            --output capture-output

      - name: Upload short-lived evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: footage-app-store-public-assets
          path: capture-output/
          retention-days: 1
          if-no-files-found: error
