name: Materialize Grumbl analysis payload

on:
  push:
    branches:
      - agent/grumbl-ui-reference-analysis
    paths:
      - tools/.payload/grumbl-*.b64part
      - .github/workflows/materialize-grumbl-analysis.yml

permissions:
  contents: write

concurrency:
  group: materialize-grumbl-analysis
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v4
        with:
          ref: agent/grumbl-ui-reference-analysis
          fetch-depth: 0

      - name: Decode and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat tools/.payload/grumbl-*.b64part | base64 --decode > /tmp/grumbl-analysis.tar.xz
          echo "da49887df18364628663e835c859299f6c7ef8a843eb9ce5708408d57e18bf74  /tmp/grumbl-analysis.tar.xz" | sha256sum --check --strict
          mkdir -p /tmp/grumbl-analysis
          tar -xJf /tmp/grumbl-analysis.tar.xz -C /tmp/grumbl-analysis
          test -s /tmp/grumbl-analysis/analysis.md
          test -s /tmp/grumbl-analysis/manifest.json
          test -s /tmp/grumbl-analysis/source-map.md
          test -s /tmp/grumbl-analysis/tokens.tokens.json

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Validate analysis contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('.')
          payload = Path('/tmp/grumbl-analysis')
          schema = json.loads((root / 'schemas/ui-reference-analysis.schema.json').read_text(encoding='utf-8'))
          manifest = json.loads((payload / 'manifest.json').read_text(encoding='utf-8'))
          tokens = json.loads((payload / 'tokens.tokens.json').read_text(encoding='utf-8'))
          analysis = (payload / 'analysis.md').read_text(encoding='utf-8')
          source_map = (payload / 'source-map.md').read_text(encoding='utf-8')

          Draft202012Validator.check_schema(schema)
          errors = sorted(Draft202012Validator(schema).iter_errors(manifest), key=lambda item: list(item.path))
          if errors:
              for error in errors:
                  print(f"manifest error at {list(error.path)}: {error.message}")
              raise SystemExit(1)

          assert manifest['analysisId'] == 'UIR-20260809-001'
          assert manifest['status'] == 'complete'
          assert len(manifest['references']) == 6
          assert [item['id'] for item in manifest['references']] == [f'REF-{i:02d}' for i in range(1, 7)]
          assert all(item['viewport'] == {'width': 1284, 'height': 2778, 'unit': 'px'} for item in manifest['references'])
          assert manifest['referenceStorage'] == 'link_only'
          assert len(manifest['elements']) >= 30
          assert analysis.count('REF-0') >= 6
          assert 'UIR-20260809-001' in analysis
          assert 'REF-06' in source_map
          assert isinstance(tokens, dict) and tokens
          print(f"validated {manifest['analysisId']}: {len(manifest['references'])} references, {len(manifest['elements'])} elements")
          PY

      - name: Install validated analysis and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          target="analyses/2026/2026-08-09--grumbl--all-app-store-screenshots"
          mkdir -p "$target/references"
          install -m 0644 /tmp/grumbl-analysis/analysis.md "$target/analysis.md"
          install -m 0644 /tmp/grumbl-analysis/manifest.json "$target/manifest.json"
          install -m 0644 /tmp/grumbl-analysis/source-map.md "$target/references/source-map.md"
          install -m 0644 /tmp/grumbl-analysis/tokens.tokens.json "$target/tokens.tokens.json"
          rm -rf tools/.payload
          rm -f .github/workflows/materialize-grumbl-analysis.yml

      - name: Commit validated analysis
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "add UIR-20260809-001 Grumbl analysis"
          git push origin HEAD:agent/grumbl-ui-reference-analysis
