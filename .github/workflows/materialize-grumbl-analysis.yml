name: Materialize Grumbl analysis payload

on:
  pull_request:
    branches: [main]
    paths:
      - tools/.payload/grumbl-*.b64part
      - .github/workflows/materialize-grumbl-analysis.yml

permissions:
  contents: write

concurrency:
  group: materialize-grumbl-analysis
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v4
        with:
          ref: agent/grumbl-ui-reference-analysis
          fetch-depth: 0

      - name: Decode and verify payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          expected = {
              'grumbl-00.b64part': ('f6feab8e49ff2aa2068c2dcacd33dac857421ec9d55c100d98686f76990af67c', 7900),
              'grumbl-01.b64part': ('b4a81e06073f23fc47fb07bb32579e7c20f7b5e9a3fd1c8045a4b55ce4638891', 7900),
              'grumbl-02.b64part': ('59be56394e7050ac7bdac830ac9233b529e1ca4ee4318ea2f229454d6460a50d', 7900),
              'grumbl-03.b64part': ('3670d7508983f9307401881e746efc3a460052a15d21ab5be6baef3e05d88fd2', 7900),
              'grumbl-04.b64part': ('4c77da446816831f2b24fe275016cfe13677b3f9579d5b7349e9d5e6e83bab1b', 7900),
              'grumbl-05.b64part': ('ffe0ea19fe39ba4466c0c458244d2f9339b0a09de6792441cf9ee7459f41071b', 7900),
              'grumbl-06.b64part': ('f2464d013762ffc03b729944865a0a22159773eedb008873d5a1a02fd787b0a3', 16),
          }
          paths = sorted(Path('tools/.payload').glob('grumbl-*.b64part'))
          assert len(paths) == 7, paths
          chunks = []
          mismatches = []
          for path in paths:
              data = path.read_bytes()
              expected_digest, expected_size = expected[path.name]
              original_digest = hashlib.sha256(data).hexdigest()
              print(path.name, len(data), original_digest)

              if len(data) == expected_size + 1 and original_digest != expected_digest:
                  repaired = None
                  for index in range(len(data)):
                      candidate = data[:index] + data[index + 1:]
                      if hashlib.sha256(candidate).hexdigest() == expected_digest:
                          repaired = candidate
                          print(f"repaired {path.name}: removed byte at index {index}: {data[index:index+1]!r}")
                          break
                  if repaired is not None:
                      data = repaired

              digest = hashlib.sha256(data).hexdigest()
              if len(data) != expected_size or digest != expected_digest:
                  mismatches.append((path.name, len(data), digest, expected_size, expected_digest))
              chunks.append(data)

          if mismatches:
              for item in mismatches:
                  print('MISMATCH', item)
              raise SystemExit('staged payload chunks differ from local source')

          encoded = b''.join(chunks)
          decoded = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(decoded).hexdigest()
          print('decoded', len(decoded), digest)
          if digest != 'da49887df18364628663e835c859299f6c7ef8a843eb9ce5708408d57e18bf74':
              raise SystemExit('decoded archive SHA-256 mismatch')
          Path('/tmp/grumbl-analysis.tar.xz').write_bytes(decoded)
          PY
          mkdir -p /tmp/grumbl-analysis
          tar -xJf /tmp/grumbl-analysis.tar.xz -C /tmp/grumbl-analysis
          test -s /tmp/grumbl-analysis/analysis.md
          test -s /tmp/grumbl-analysis/manifest.json
          test -s /tmp/grumbl-analysis/source-map.md
          test -s /tmp/grumbl-analysis/tokens.tokens.json

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Validate analysis contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('.')
          payload = Path('/tmp/grumbl-analysis')
          schema = json.loads((root / 'schemas/ui-reference-analysis.schema.json').read_text(encoding='utf-8'))
          manifest = json.loads((payload / 'manifest.json').read_text(encoding='utf-8'))
          tokens = json.loads((payload / 'tokens.tokens.json').read_text(encoding='utf-8'))
          analysis = (payload / 'analysis.md').read_text(encoding='utf-8')
          source_map = (payload / 'source-map.md').read_text(encoding='utf-8')

          Draft202012Validator.check_schema(schema)
          errors = sorted(Draft202012Validator(schema).iter_errors(manifest), key=lambda item: list(item.path))
          if errors:
              for error in errors:
                  print(f"manifest error at {list(error.path)}: {error.message}")
              raise SystemExit(1)

          assert manifest['analysisId'] == 'UIR-20260809-001'
          assert manifest['status'] == 'complete'
          assert len(manifest['references']) == 6
          assert [item['id'] for item in manifest['references']] == [f'REF-{i:02d}' for i in range(1, 7)]
          assert all(item['viewport'] == {'width': 1284, 'height': 2778, 'unit': 'px'} for item in manifest['references'])
          assert manifest['referenceStorage'] == 'link_only'
          assert len(manifest['elements']) >= 30
          assert analysis.count('REF-0') >= 6
          assert 'UIR-20260809-001' in analysis
          assert 'REF-06' in source_map
          assert isinstance(tokens, dict) and tokens
          print(f"validated {manifest['analysisId']}: {len(manifest['references'])} references, {len(manifest['elements'])} elements")
          PY

      - name: Install validated analysis and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          target="analyses/2026/2026-08-09--grumbl--all-app-store-screenshots"
          mkdir -p "$target/references"
          install -m 0644 /tmp/grumbl-analysis/analysis.md "$target/analysis.md"
          install -m 0644 /tmp/grumbl-analysis/manifest.json "$target/manifest.json"
          install -m 0644 /tmp/grumbl-analysis/source-map.md "$target/references/source-map.md"
          install -m 0644 /tmp/grumbl-analysis/tokens.tokens.json "$target/tokens.tokens.json"
          rm -rf tools/.payload
          rm -f .github/workflows/materialize-grumbl-analysis.yml

      - name: Commit validated analysis
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check -- ':!*.md'
          git commit -m "add UIR-20260809-001 Grumbl analysis"
          git push origin HEAD:agent/grumbl-ui-reference-analysis
